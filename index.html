<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق دينار المستقر</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
transition: all 0.25s ease;
}
body { margin: 0;
padding: 15px;
background: radial-gradient(circle at center, #131826 0%, #070913 100%);
color: #ffffff;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
}
.container { width: 100%;
max-width: 420px;
}
.screen-page { display: none;
width: 100%;
min-height: 90vh;
flex-direction: column;
}
.screen-page.active { display: flex;
}
.auth-card { background: rgba(30, 41, 59, 0.85);
backdrop-filter: blur(16px);
border: 1px solid rgba(245, 158, 11, 0.4);
border-radius: 24px;
padding: 24px 20px;
box-shadow: 0 20px 40px rgba(0,0,0,0.8);
text-align: center;
margin: auto 0;
}
.tab-switch { display: flex;
background: rgba(15, 23, 42, 0.8);
border-radius: 12px;
padding: 4px;
margin-bottom: 16px;
}
.tab-btn { flex: 1;
padding: 8px;
border: none;
background: transparent;
color: #94a3b8;
font-weight: bold;
font-size: 12px;
border-radius: 8px;
cursor: pointer;
}
.tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706);
color: #fff;
}
.input-box, .select-box { width: 100%;
padding: 11px;
margin-bottom: 10px;
background: rgba(15, 23, 42, 0.7);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 10px;
color: #fff;
font-size: 12px;
outline: none;
}
.top-nav { display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 12px;
}
.nav-btn { background: rgba(30, 41, 59, 0.8);
border: 1px solid rgba(255, 255, 255, 0.1);
color: #f59e0b;
padding: 6px 12px;
border-radius: 8px;
font-size: 11px;
font-weight: bold;
cursor: pointer;
position: relative;
}
.nav-btn.back { color: #38bdf8;
border-color: rgba(56, 189, 248, 0.3);
}
.notification-badge { position: absolute;
top: -4px;
right: -4px;
width: 10px;
height: 10px;
background-color: #ef4444;
border-radius: 50%;
border: 2px solid #131826;
display: none;
}
.balance-header { background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
border: 1px solid rgba(245, 158, 11, 0.4);
padding: 12px;
border-radius: 14px;
text-align: center;
margin-bottom: 12px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.balance-header span { color: #84cc16;
font-size: 24px;
font-weight: 800;
}
.card { background: rgba(30, 30, 30, 0.65);
border: 1px solid rgba(255, 255, 255, 0.08);
padding: 12px;
border-radius: 14px;
margin-bottom: 10px;
text-align: center;
}
.clock-container { margin: 0 auto 8px auto;
width: 80px;
height: 80px;
border-radius: 50%;
background: radial-gradient(circle, #3d2b00 0%, #1a1200 100%);
border: 2px solid #f59e0b;
display: flex;
justify-content: center;
align-items: center;
}
.spinning-coin { font-size: 30px;
animation: spinCoin 3s linear infinite;
}
@keyframes spinCoin { 0% { transform: rotate(0deg);
} 100% { transform: rotate(360deg);
} }
button.action-btn { width: 100%;
padding: 10px;
border: none;
border-radius: 9px;
font-weight: bold;
font-size: 12px;
cursor: pointer;
}
.btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706);
color: #fff;
}
.btn-blue { background: linear-gradient(135deg, #0ea5e9, #0284c7);
color: #fff;
}
.btn-purple { background: linear-gradient(135deg, #a855f7, #7e22ce);
color: #fff;
}
.btn-green { background: linear-gradient(135deg, #10b981, #059669);
color: #fff;
}
.shop-tabs { display: flex;
gap: 5px;
margin-bottom: 10px;
}
.shop-tab-btn { flex: 1;
padding: 7px;
background: rgba(30, 41, 59, 0.6);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 8px;
color: #94a3b8;
font-weight: bold;
font-size: 11px;
cursor: pointer;
}
.shop-tab-btn.active-gold { background: linear-gradient(135deg, #f59e0b, #d97706);
color: #fff;
}
.shop-tab-btn.active-diamond { background: linear-gradient(135deg, #0ea5e9, #0284c7);
color: #fff;
}
.shop-tab-btn.active-legend { background: linear-gradient(135deg, #a855f7, #7e22ce);
color: #fff;
}
.shop-tier-content { display: none;
}
.shop-tier-content.active { display: block;
}
</style>
</head>
<body>
<div class="container">
  <!-- شاشة تسجيل الدخول وإنشاء الحساب -->
  <div id="authScreen" class="screen-page active">
    <div class="auth-card">
      <h2 style="color: #f59e0b; margin-top:0;">تطبيق دينار</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">سجل دخولك أو أنشئ حساباً جديداً للبدء</p>
      
      <div class="tab-switch">
        <button class="tab-btn active" onclick="switchAuthTab('login')">تسجيل دخول</button>
        <button class="tab-btn" onclick="switchAuthTab('register')">حساب جديد</button>
      </div>

      <div id="loginForm">
        <input type="text" id="loginId" class="input-box" placeholder="أدخل الأيدي (ID) الخاص بك">
        <input type="password" id="loginPass" class="input-box" placeholder="كلمة المرور">
        <button class="action-btn btn-gold" onclick="performLogin()" style="margin-top: 5px;">دخول للتطبيق</button>
      </div>

      <div id="registerForm" style="display: none;">
        <input type="text" id="regName" class="input-box" placeholder="اسم المستخدم">
        <input type="text" id="regId" class="input-box" placeholder="اختر أيدي (ID) فريد">
        <input type="password" id="regPass" class="input-box" placeholder="كلمة المرور">
        <button class="action-btn btn-blue" onclick="performRegister()" style="margin-top: 5px;">إنشاء الحساب</button>
      </div>
    </div>
  </div>

  <!-- الشاشة الرئيسية للتطبيق -->
  <div id="mainScreen" class="screen-page">
    <div class="top-nav">
      <button class="nav-btn" onclick="openProfile()">الملف الشخصي</button>
      <button class="nav-btn back" onclick="logout()">خروج</button>
    </div>

    <div class="balance-header">
      رصيدك الحالي<br>
      <span id="userBalance">0</span> <small style="font-size: 12px; color: #f59e0b;">دينار</small>
    </div>

    <div class="card">
      <div class="clock-container">
        <div class="spinning-coin">🪙</div>
      </div>
      <h3 style="margin: 5px 0; color: #f59e0b; font-size: 16px;">العداد اليومي للأرباح</h3>
      <p id="timerDisplay" style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">اضغط للاستلام والمتابعة</p>
      <button class="action-btn btn-gold" onclick="claimDailyReward()">استلام الهدية اليومية</button>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
      <button class="action-btn btn-blue" style="flex:1;" onclick="openRooms()">غرف الدردشة</button>
      <button class="action-btn btn-purple" style="flex:1;" onclick="openShop()">متجر العدادات</button>
    </div>
  </div>
</div>

<script>
// دوال التنقل البسيطة داخل التطبيق
function switchAuthTab(tab) {
  const loginBtn = document.querySelectorAll('.tab-btn')[0];
  const regBtn = document.querySelectorAll('.tab-btn')[1];
  const loginF = document.getElementById('loginForm');
  const regF = document.getElementById('registerForm');
  
  if(tab === 'login') {
    loginBtn.classList.add('active');
    regBtn.classList.remove('active');
    loginF.style.display = 'block';
    regF.style.display = 'none';
  } else {
    regBtn.classList.add('active');
    loginBtn.classList.remove('active');
    regF.style.display = 'block';
    loginF.style.display = 'none';
  }
}

function performLogin() {
  const id = document.getElementById('loginId').value;
  if(!id) {
    alert('يرجى إدخال الأيدي الخاص بك');
    return;
  }
  document.getElementById('authScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
}

function performRegister() {
  const name = document.getElementById('regName').value;
  const id = document.getElementById('regId').value;
  if(!name || !id) {
    alert('يرجى ملء جميع الحقول المطلوبة');
    return;
  }
  alert('تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.');
  switchAuthTab('login');
}

function logout() {
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('authScreen').classList.add('active');
}

function claimDailyReward() {
  let currentBalance = parseInt(document.getElementById('userBalance').innerText);
  currentBalance += 100;
  document.getElementById('userBalance').innerText = currentBalance;
  alert('تم إضافة 100 دينار إلى رصيدك بنجاح!');
}

function openRooms() {
  alert('جاري الانتقال إلى غرف الدردشة وغرف الميكروفون الآمنة...');
}

function openShop() {
  alert('جاري فتح متجر العدادات (الذهبي، الماسي، والأسطوري)...');
}

function openProfile() {
  alert('عرض لوحة التحكم والملف الشخصي والأيدي الخاص بك...');
}
</script>
</body>
</html>
