<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق دينار المستقر</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
transition: all 0.25s ease;
}
body { margin: 0;
padding: 15px;
background: radial-gradient(circle at center, #131826 0%, #070913 100%);
color: #ffffff;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
}
.container { width: 100%;
max-width: 420px;
}
.screen-page { display: none;
width: 100%;
min-height: 90vh;
flex-direction: column;
}
.screen-page.active { display: flex;
}
.auth-card { background: rgba(30, 41, 59, 0.85);
backdrop-filter: blur(16px);
border: 1px solid rgba(245, 158, 11, 0.4);
border-radius: 24px;
padding: 24px 20px;
box-shadow: 0 20px 40px rgba(0,0,0,0.8);
text-align: center;
margin: auto 0;
}
.tab-switch { display: flex;
background: rgba(15, 23, 42, 0.8);
border-radius: 12px;
padding: 4px;
margin-bottom: 16px;
}
.tab-btn { flex: 1;
padding: 8px;
border: none;
background: transparent;
color: #94a3b8;
font-weight: bold;
font-size: 12px;
border-radius: 8px;
cursor: pointer;
}
.tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706);
color: #fff;
}
.input-box, .select-box { width: 100%;
padding: 11px;
margin-bottom: 10px;
background: rgba(15, 23, 42, 0.7);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 10px;
color: #fff;
font-size: 12px;
outline: none;
}
.top-nav { display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 12px;
}
.nav-btn { background: rgba(30, 41, 59, 0.8);
border: 1px solid rgba(255, 255, 255, 0.1);
color: #f59e0b;
padding: 6px 12px;
border-radius: 8px;
font-size: 11px;
font-weight: bold;
cursor: pointer;
position: relative;
}
.nav-btn.back { color: #38bdf8;
border-color: rgba(56, 189, 248, 0.3);
}
.notification-badge { position: absolute;
top: -4px;
right: -4px;
width: 10px;
height: 10px;
background-color: #ef4444;
border-radius: 50%;
border: 2px solid #131826;
display: none;
}
.balance-header { background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
border: 1px solid rgba(245, 158, 11, 0.4);
padding: 12px;
border-radius: 14px;
text-align: center;
margin-bottom: 12px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.balance-header span { color: #84cc16;
font-size: 24px;
font-weight: 800;
}
.card { background: rgba(30, 30, 30, 0.65);
border: 1px solid rgba(255, 255, 255, 0.08);
padding: 12px;
border-radius: 14px;
margin-bottom: 10px;
text-align: center;
}
.clock-container { margin: 0 auto 8px auto;
width: 80px;
height: 80px;
border-radius: 50%;
background: radial-gradient(circle, #3d2b00 0%, #1a1200 100%);
border: 2px solid #f59e0b;
display: flex;
justify-content: center;
align-items: center;
}
.spinning-coin { font-size: 30px;
animation: spinCoin 3s linear infinite;
}
@keyframes spinCoin { 0% { transform: rotate(0deg);
} 100% { transform: rotate(360deg);
} }
button.action-btn { width: 100%;
padding: 10px;
border: none;
border-radius: 9px;
font-weight: bold;
font-size: 12px;
cursor: pointer;
}
.btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706);
color: #fff;
}
.btn-blue { background: linear-gradient(135deg, #0ea5e9, #0284c7);
color: #fff;
}
.btn-purple { background: linear-gradient(135deg, #a855f7, #7e22ce);
color: #fff;
}
.btn-green { background: linear-gradient(135deg, #10b981, #059669);
color: #fff;
}
.shop-tabs { display: flex;
gap: 5px;
margin-bottom: 10px;
}
.shop-tab-btn { flex: 1;
padding: 7px;
background: rgba(30, 41, 59, 0.6);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 8px;
color: #94a3b8;
font-weight: bold;
font-size: 11px;
cursor: pointer;
}
.shop-tab-btn.active-gold { background: linear-gradient(135deg, #f59e0b, #d97706);
color: #fff;
}
.shop-tab-btn.active-diamond { background: linear-gradient(135deg, #0ea5e9, #0284c7);
color: #fff;
}
.shop-tab-btn.active-legend { background: linear-gradient(135deg, #a855f7, #7e22ce);
color: #fff;
}
.shop-tier-content { display: none;
}
.shop-tier-content.active { display: block;
}
.counter-row { display: flex;
justify-content: space-between;
align-items: center;
background: rgba(255,255,255,0.03);
border: 1px solid #1e293b;
padding: 8px 10px;
border-radius: 8px;
margin-bottom: 5px;
text-align: right;
}
.counter-row button { width: auto;
padding: 5px 10px;
font-size: 11px;
}
.profile-box { text-align: center;
background: rgba(30,41,59,0.7);
border: 1px solid rgba(245,158,11,0.3);
border-radius: 16px;
padding: 15px;
margin-bottom: 10px;
}
.large-avatar { width: 85px;
height: 85px;
border-radius: 50%;
object-fit: cover;
border: 3px solid #f59e0b;
margin: 0 auto 8px auto;
display: block;
background: #222;
cursor: pointer;
}
.large-avatar:hover { opacity: 0.85;
transform: scale(1.02);
}
.wheel-box { width: 180px;
height: 180px;
border-radius: 50%;
border: 6px solid #f59e0b;
margin: 10px auto;
position: relative;
overflow: hidden;
transition: transform 5s cubic-bezier(0.05, 0.9, 0.1, 1);
background: conic-gradient(#ef4444 0deg 60deg, #3b82f6 60deg 120deg, #10b981 120deg 180deg, #f59e0b 180deg 240deg, #8b5cf6 240deg 300deg, #ec4899 300deg 360deg);
}
.wheel-pointer { width: 0;
height: 0;
border-left: 8px solid transparent;
border-right: 8px solid transparent;
border-top: 15px solid #fff;
margin: 0 auto;
margin-bottom: -6px;
z-index: 10;
position: relative;
}
.modal { display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
justify-content: center;
align-items: center;
z-index: 1000;
padding: 15px;
}
.modal-content { background: #121826;
border: 1px solid rgba(245, 158, 11, 0.4);
border-radius: 16px;
width: 100%;
max-width: 380px;
padding: 16px;
max-height: 90vh;
overflow-y: auto;
}
</style>
</head>
<body>
<div class="container">
<!-- واجهة تسجيل الدخول والإنشاء -->
<div id="authScreen" class="screen-page active">
<div class="auth-card">
<h2 style="color: #f59e0b; margin-top:0;">تطبيق دينار</h2>
</div>
</div>
</div>
</body>
</html>
